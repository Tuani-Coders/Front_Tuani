name: frontend-penascal-dev

services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - ./:/app:delegated
      - /app/node_modules
    ports:
      - "${APP_PORT:-4173}:4173"
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0 --port ${APP_PORT:-4173}
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
